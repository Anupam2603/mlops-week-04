apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api-deployment
spec:
  # Start with 1 replica, as requested by the assignment
  replicas: 1
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
      - name: iris-api-container
        # Placeholder image path (replaced by CI/CD pipeline)
        image: gcr.io/google-project/iris-api:latest
        ports:
        - containerPort: 5050
        
        # --- CRITICAL FOR AUTOSCALING ---
        # HPA needs these numbers to calculate CPU percentage.
        resources:
          requests:
            cpu: "250m"    # 250 millicores (0.25 CPU)
            memory: "256Mi"
          limits:
            cpu: "500m"    # 500 millicores (0.5 CPU)
            memory: "512Mi"
        # --------------------------------

        # Environment variable for MLflow (replaced by CI/CD pipeline)
        env:
        - name: MLFLOW_TRACKING_URI
          value: "MLFLOW_URI_PLACEHOLDER"

        # Health checks to prevent traffic to broken pods
        livenessProbe:
          httpGet:
            path: /
            port: 5050
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 5050
          initialDelaySeconds: 5
          periodSeconds: 10