name: CI-CD Pipeline for Iris API

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# --- UPDATE THESE VARIABLES WITH YOUR PROJECT DETAILS ---
env:
  GCP_PROJECT_ID: stunning-agency-472702-a0 
  GKE_CLUSTER_NAME: autopilot-cluster-1 
  GKE_REGION: us-central1                  
  ARTIFACT_REGISTRY: iris-api-repo         
  IMAGE_NAME: iris-api
# ------------------------------------------------------

jobs:
  # --- JOB 1: Continuous Integration (CI) ---
  # This job runs pytest to make sure our code is good.
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Pytest
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: pytest

  # --- JOB 2: Continuous Deployment (CD) ---
  # This job only runs if the 'test' job succeeds.
  build-and-deploy:
    name: Build and Deploy to GKE
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Authenticate to Google Cloud
      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CD_SERVICE_ACCOUNT_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      # 2. Install GKE Auth Plugin (Fixes kubectl authentication)
      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin

      # 3. Configure Docker to use gcloud as a credential helper
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GKE_REGION }}-docker.pkg.dev

      # 4. Build and Push the Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build --tag ${{ env.GKE_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.GKE_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 5. Connect to GKE Cluster
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} --region ${{ env.GKE_REGION }}

      # 6. Deploy to GKE
      - name: Deploy to GKE
        run: |
          # A. Update deployment.yml with the exact image path
          sed -i 's|image: .*|image: ${{ env.GKE_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest|' k8s/deployment.yml
          
          # B. Inject the MLflow URI secret into the deployment manifest
          sed -i 's|MLFLOW_URI_PLACEHOLDER|${{ secrets.MLFLOW_TRACKING_URI }}|' k8s/deployment.yml
          
          # C. Apply all instruction manuals to the cluster
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/hpa.yml

  # --- JOB 3: Stress Test (CD) ---
  # This job runs *after* deployment to stress test the API using wrk
  stress-test:
    name: Run Stress Test with wrk
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Authenticate to GCP (Needed to get the Load Balancer IP)
      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CD_SERVICE_ACCOUNT_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin

      # 2. Connect to GKE
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} --region ${{ env.GKE_REGION }}
      
      # 3. Install wrk
      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      # 4. Get the API's Public IP Address
      - name: Get API Public IP
        id: get_ip
        run: |
          echo "Waiting for Load Balancer IP..."
          for i in {1..12}; do
            IP=$(kubectl get service iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "IP found: $IP"
              echo "SERVICE_IP=$IP" >> $GITHUB_OUTPUT
              break
            fi
            sleep 10
          done
          if [ -z "$IP" ]; then
            echo "Load Balancer IP not found."
            exit 1
          fi

      # 5. Create the Lua script dynamically (Embeds the file directly in the runner)
      - name: Create wrk script
        run: |
          cat <<EOF > post_body.lua
          wrk.body = '{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}'
          wrk.headers["Content-Type"] = "application/json"
          wrk.method = "POST"
          EOF

      # 6. Run the Stress Test
      - name: Run wrk stress test (1000 connections)
        run: |
          echo "Running stress test on http://${{ steps.get_ip.outputs.SERVICE_IP }}/predict"
          # Run for 90 seconds to give the HPA time to react and scale up
          wrk -t4 -c1000 -d90s -s post_body.lua http://${{ steps.get_ip.outputs.SERVICE_IP }}/predict
